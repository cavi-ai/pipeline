[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "cavi-pipeline"
dynamic = ["version"]
description = "LangGraph workflow engine mounted in CAVI pipeline MCP servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CAVI AI" }]
keywords = ["mcp", "langgraph", "workflow", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.15"
dependencies = [
    "cavi-mcp-core",
    "langgraph>=1.2.24,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
]

[project.urls]
Homepage = "https://github.com/cavi-ai/pipeline#readme"
Repository = "https://github.com/cavi-ai/pipeline"
Issues = "https://github.com/cavi-ai/pipeline/issues"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv.sources]
cavi-mcp-core = { git = "https://github.com/cavi-ai/mcp-core.git", branch = "main" }

# The version comes from the git tag: vX.Y.Z builds X.Y.Z, later commits X.Y.(Z+1).devN+g<sha>.
[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cavi_pipeline"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/skills", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
